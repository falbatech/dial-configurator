; FalbaTech DIAL FT - Elecrow CrowPanel 1.28" (ESP32-S3R8, GC9A01 240x240)
[env:crowpanel128]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
board_build.flash_size = 16MB
board_build.partitions = default_16MB.csv
board_build.arduino.memory_type = qio_opi
monitor_speed = 115200
extra_scripts = pre:tools/framework_include.py
lib_deps =
  bodmer/TFT_eSPI@^2.5.43
  adafruit/Adafruit NeoPixel@^1.12.3
  bblanchon/ArduinoJson@^7.2.1
build_flags =
  ; --- USB: TinyUSB composite (CDC + HID keyboard/mouse/consumer) ---
  -UARDUINO_USB_MODE
  -UARDUINO_USB_CDC_ON_BOOT
  -DARDUINO_USB_MODE=0
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DBOARD_HAS_PSRAM
  ; --- TFT_eSPI setup (sprawdz z factory_soucecode Elecrow!) ---
  -DUSER_SETUP_LOADED=1
  -DGC9A01_DRIVER=1
  -DUSE_HSPI_PORT=1
  -DTFT_WIDTH=240
  -DTFT_HEIGHT=240
  -DTFT_MOSI=11
  -DTFT_SCLK=10
  -DTFT_CS=9
  -DTFT_DC=3
  -DTFT_RST=14
  -DTFT_MISO=-1
  -DTFT_RGB_ORDER=TFT_RGB
  -DSPI_FREQUENCY=40000000
  -DLOAD_GLCD=1
  -DLOAD_FONT2=1
  -DLOAD_FONT4=1
  -DLOAD_FONT6=1

; Diagnostyka: pio run -e diag -t upload && pio device monitor -e diag
[env:diag]
extends = env:crowpanel128
build_unflags = -DARDUINO_USB_MODE=0
build_flags =
  ${env:crowpanel128.build_flags}
  -DARDUINO_USB_MODE=1
build_src_filter = -<*> +<../diag/main.cpp>
